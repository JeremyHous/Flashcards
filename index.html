<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Simple flashcards that live in your browser.">
  <title>Flashcards</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash of the wrong colors.
    try {
      var theme = localStorage.getItem('flashcards.theme');
      if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="flag-backdrop" aria-hidden="true">
    <div class="flag flag-fr"><span class="trophy">🏆</span></div>
    <div class="flag flag-de"><span class="trophy">🏆</span></div>
    <div class="flag flag-es"><span class="trophy">🏆</span></div>
  </div>

  <header class="site-header">
    <a href="#/" class="brand">🗂️ Flashcards</a>
    <div class="header-right">
      <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false">🌙 Black mode</button>
      <img src="JHoussin-small.jpg" alt="Profile photo" class="avatar" width="44" height="44">
    </div>
  </header>

  <main id="app" class="container" tabindex="-1"></main>

  <footer class="site-footer container">
    Your cards are stored only in this browser. Use <strong>Export</strong> to back them up.
  </footer>

  <dialog id="card-dialog">
    <form method="dialog" id="card-form">
      <h2>Edit card</h2>
      <label>Question
        <textarea name="question" rows="3" required></textarea>
      </label>
      <label>Answer
        <textarea name="answer" rows="3" required></textarea>
      </label>
      <div class="actions">
        <button type="submit" value="cancel" formnovalidate>Cancel</button>
        <button type="submit" value="save" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
